[project]
name = "streamfusion-camera-inspector"
version = "0.1.0"
description = "Independent camera inspection: P0 control, media and storage contract experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic-settings==2.15.0",
    "PyMySQL[rsa]==1.1.2",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
    "mypy==2.3.1",
    "types-PyMySQL>=1.1.0",
    "boto3==1.43.120",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "mysql: isolated real MySQL contract tests",
    "media: local FFmpeg/ZLM execution and resource verification",
    "storage: isolated real S3 capability and upload verification",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
files = ["src/camera_inspector"]
