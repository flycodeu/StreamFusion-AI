spring:
  application:
    name: streamfusion-platform-api
  profiles:
    default: dev
  jackson:
    time-zone: Asia/Shanghai
    deserialization:
      fail-on-unknown-properties: true
  session:
    timeout: ${SF_AUTH_IDLE_TIMEOUT:30m}
    redis:
      namespace: streamfusion:${spring.profiles.active:${spring.profiles.default}}:session
      flush-mode: immediate
  lifecycle:
    timeout-per-shutdown-phase: ${streamfusion.shutdown-grace}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 3000
      validation-timeout: 2000
      connection-init-sql: "SET time_zone = '+08:00'"
  sql:
    init:
      mode: never
  data:
    redis:
      connect-timeout: 3s
      timeout: 3s
      repositories:
        enabled: false
mybatis-plus:
  mapper-locations: classpath*:/com/streamfusion/platform/**/mapper/*Mapper.xml
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    local-cache-scope: statement
    map-underscore-to-camel-case: true
    default-statement-timeout: 5
  global-config:
    banner: false
    db-config:
      id-type: assign_id
streamfusion:
  work-dir: ${SF_API_WORK_DIR:.run}
  shutdown-grace: ${SF_API_SHUTDOWN_GRACE:15s}
platform:
  login-record:
    activity-interval: ${SF_LOGIN_ACTIVITY_INTERVAL:60s}
    ipv4-database: ${SF_IP_REGION_V4_DB:.run/ip-region/ip2region_v4.xdb}
    ipv6-database: ${SF_IP_REGION_V6_DB:.run/ip-region/ip2region_v6.xdb}
    local-networks: []
  server-monitor:
    web-host: ${SF_MONITOR_WEB_HOST:127.0.0.1}
    web-port: ${SF_MONITOR_WEB_PORT:8090}
  ip-guard:
    enabled: ${SF_IP_GUARD_ENABLED:true}
    failure-threshold: ${SF_IP_FAILURE_THRESHOLD:20}
    failure-window: ${SF_IP_FAILURE_WINDOW:10m}
    resource-limit: ${SF_IP_RESOURCE_LIMIT:120}
    resource-window: ${SF_IP_RESOURCE_WINDOW:1m}
    redis-namespace: streamfusion:${spring.profiles.active:${spring.profiles.default}}:guard
    trusted-proxies: ${SF_TRUSTED_PROXIES:}
  bootstrap:
    username: ${SF_BOOTSTRAP_USERNAME:admin}
    nickname: ${SF_BOOTSTRAP_NICKNAME:超级管理员}
    department-id: ${SF_BOOTSTRAP_DEPARTMENT_ID:2002}
  auth:
    idle-timeout: ${SF_AUTH_IDLE_TIMEOUT:30m}
    absolute-timeout: ${SF_AUTH_ABSOLUTE_TIMEOUT:8h}
    secure-cookie: ${SF_AUTH_SECURE_COOKIE:true}
    initial-password: ${SF_AUTH_INITIAL_PASSWORD:}
    worker-id: ${SF_AUTH_WORKER_ID:0}
    datacenter-id: ${SF_AUTH_DATACENTER_ID:0}
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
server:
  forward-headers-strategy: none
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
