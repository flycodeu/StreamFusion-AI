# Load personal configuration only when the local profile is selected.
platform:
  ip-guard:
    trusted-proxies: ${SF_TRUSTED_PROXIES:127.0.0.1,::1}
  auth:
    secure-cookie: ${SF_AUTH_SECURE_COOKIE:false}
    initial-password: ${SF_AUTH_INITIAL_PASSWORD:StreamFusion@123}
# Required on purpose: a missing local file must not silently use other defaults.
spring:
  config:
    import: "file:${LOCAL_CONFIG_PATH:./config/application-local.yml}"
