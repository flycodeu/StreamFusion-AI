# Public production defaults; inject deployment-specific values externally.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    root: INFO
    com.streamfusion: INFO
