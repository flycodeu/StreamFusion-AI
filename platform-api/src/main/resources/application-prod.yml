# Public production defaults; inject deployment-specific values externally.
platform:
  server-monitor:
    web-host: ${SF_MONITOR_WEB_HOST:127.0.0.1}
    web-port: ${SF_MONITOR_WEB_PORT:0}
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE}
      password: ${REDIS_PASSWORD}
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    root: INFO
    com.streamfusion: INFO
