# Test-only resource: never packaged into the application JAR.
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  datasource:
    url: jdbc:h2:mem:foundation;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      connection-init-sql: "SET TIME ZONE '+08:00'"
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      database: 0
      password: ""
management:
  health:
    redis:
      enabled: false
server:
  address: 127.0.0.1
  port: 0
logging:
  level:
    root: WARN
    com.streamfusion: WARN
platform:
  login-record:
    ipv4-database: ""
    ipv6-database: ""
  ip-guard:
    enabled: false
  auth:
    secure-cookie: false
    allow-legacy-login: true
